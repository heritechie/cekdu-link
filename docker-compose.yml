services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-18080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cekdu_link}
      DB_USER: ${DB_USER:-cekdu}
      DB_PASSWORD: ${DB_PASSWORD:-cekdu_local_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cekdu_link}
      POSTGRES_USER: ${DB_USER:-cekdu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cekdu_local_dev}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cekdu} -d ${DB_NAME:-cekdu_link}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: